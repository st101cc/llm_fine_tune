<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08111f" />
    <title>ForgeTune — Local model training</title>
    <meta name="description" content="Fine-tune language models on your own computer." />
    <link rel="stylesheet" href="public/styles.css" />
    <link rel="stylesheet" href="public/advisor.css" />
    <link rel="stylesheet" href="public/history.css" />
    <link rel="stylesheet" href="public/datasets.css" />
    <link rel="stylesheet" href="public/quality.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="#/workspace"><span class="brand-mark">✦</span><span>ForgeTune<small>local model studio</small></span></a>
        <nav>
          <a href="#/workspace" data-route="workspace">◈ Workspace</a>
          <a href="#/quality" data-route="quality">◇ Dataset quality</a>
          <a href="#/quality-evaluations" data-route="quality-evaluations">◇ Evaluations</a>
          <a href="#/quality-comparisons" data-route="quality-comparisons">◇ Comparisons</a>

          <span class="eyebrow">Local compute</span>
          <strong id="gpu-name">Checking GPU…</strong>

      <main id="app" class="content" tabindex="-1"></main>

    <div id="toast-region" class="toast-region" aria-live="polite"></div>
    <script src="public/datasets.js"></script>
    <script src="public/workflow-tools.js"></script>
